# Builds the image and rolls it out to Azure Container Apps on every push to master.
# Azure sign-in is OIDC (no secrets): the id-floodguard-deploy managed identity trusts this
# repo's master branch (subject repo:DarkerMinecraft@20930466/FloodGuard@1423600447:ref:refs/heads/master)
# and has AcrPush on the registry and Contributor on the container app.
# Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# NEXT_PUBLIC_MAPTILER_KEY, NEXT_PUBLIC_VAPID_PUBLIC_KEY (public values, inlined at build).
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: crfloodguard
  IMAGE: crfloodguard.azurecr.io/floodguard
  RESOURCE_GROUP: floodguard-rg
  APP: ca-floodguard

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name "$REGISTRY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MAPTILER_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$APP" --image "$IMAGE:${{ github.sha }}" --query properties.latestRevisionName -o tsv
